# Use the latest 2.1 version of CircleCI pipeline process engine.
# See: https://circleci.com/docs/configuration-reference
version: 2.1

# Orbs are reusable packages of CircleCI configuration that you may share across projects, enabling you to create encapsulated, parameterized commands, jobs, and executors that can be used across multiple projects.
# See: https://circleci.com/docs/orb-intro/
orbs:
  # https://circleci.com/developer/orbs/orb/circleci/android
  android: circleci/android@2.5.0

# Define a job to be invoked later in a workflow.
# See: https://circleci.com/docs/configuration-reference/#jobs
jobs:
  run-tests-with-bitrise-build-cache:
    # Specify the execution environment. You can specify an image from Docker Hub or use one of our convenience images from CircleCI's Developer Hub.
    # See: https://circleci.com/docs/configuration-reference/#executor-job
    executor:
      name: android/android-machine
      tag: 2024.04.1

    # Add steps to the job
    # See: https://circleci.com/docs/configuration-reference/#steps
    steps:
      - android/change-java-version:
          java-version: 17
      - checkout
      - run:
          name: Checkout submodules as well
          command: |
            git "submodule" "update" "--init" "--recursive" "--jobs=10"
      # Restore Gradle wrapper cache
      - restore_cache:
          name: Restore Gradle wrapper cache
          keys:
            - gradle-wrapper-{{ checksum "gradle/wrapper/gradle-wrapper.properties" }}
            - gradle-wrapper-
      # Restore Gradle dependencies cache
      - restore_cache:
          name: Restore Gradle dependencies cache
          keys:
            - gradle-deps-{{ checksum "build.gradle" }}-{{ checksum "app/build.gradle" }}
            - gradle-deps-
      # Restore Bitrise Build Cache CLI
      - restore_cache:
          name: Restore Bitrise Build Cache CLI
          keys:
            - bitrise-build-cache-cli-v1-{{ arch }}
            - bitrise-build-cache-cli-v1-
      - run:
          name: "Enable Build Cache for Gradle"
          command: |
            #!/usr/bin/env bash
            set -euxo pipefail
            
            # Try to download Bitrise Build Cache CLI from GitHub first
            if curl --retry 5 -sSfL 'https://raw.githubusercontent.com/bitrise-io/bitrise-build-cache-cli/main/install/installer.sh' | sh -s -- -b /tmp/bin -d; then
              echo "Successfully downloaded Bitrise Build Cache CLI from GitHub"
            elif [ -f /tmp/bin/bitrise-build-cache ]; then
              echo "GitHub download failed, using cached Bitrise Build Cache CLI"
            else
              echo "Both GitHub download and cache failed"
              exit 1
            fi
            
            # run the CLI to enable Bitrise build cache for Gradle
            /tmp/bin/bitrise-build-cache enable-for gradle
      - run:
          name: Disable Gradle Dependency Verification
          command: |
            rm ./gradle/verification-metadata.xml
      - run:
          name: Lint PlayProdDebug
          no_output_timeout: 60m
          command: ./gradlew :Signal-Android:lintPlayProdDebug
      # Save Gradle wrapper cache
      - save_cache:
          name: Save Gradle wrapper cache
          paths:
            - ~/.gradle/wrapper
          key: gradle-wrapper-{{ checksum "gradle/wrapper/gradle-wrapper.properties" }}
      # Save Gradle dependencies cache
      - save_cache:
          name: Save Gradle dependencies cache
          paths:
            - ~/.gradle/caches
          key: gradle-deps-{{ checksum "build.gradle" }}-{{ checksum "app/build.gradle" }}
      # Save Bitrise Build Cache CLI
      - save_cache:
          name: Save Bitrise Build Cache CLI
          paths:
            - /tmp/bin/bitrise-build-cache
          key: bitrise-build-cache-cli-v1-{{ arch }}
      # - run:
      #     name: Assemble playProdDebug
      #     command: ./gradlew :Signal-Android:assemblePlayProdDebug

  run-tests-with-bitrise-build-cache-no-metrics:
    # Specify the execution environment. You can specify an image from Docker Hub or use one of our convenience images from CircleCI's Developer Hub.
