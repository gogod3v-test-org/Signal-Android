            # Try to download Bitrise Build Cache CLI from GitHub first
            if curl --retry 5 -sSfL 'https://raw.githubusercontent.com/bitrise-io/bitrise-build-cache-cli/main/install/installer.sh' | sh -s -- -b /tmp/bin -d; then
              echo "Successfully downloaded Bitrise Build Cache CLI from GitHub"
