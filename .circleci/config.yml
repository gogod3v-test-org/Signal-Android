      # Restore Gradle dependencies cache
      - restore_cache:
          name: Restore Gradle dependencies cache
          keys:
            - gradle-deps-{{ checksum "build.gradle" }}-{{ checksum "app/build.gradle" }}
            - gradle-deps-
      # Restore Bitrise Build Cache CLI
      - restore_cache:
          name: Restore Bitrise Build Cache CLI
          keys:
            - bitrise-build-cache-cli-v1-{{ arch }}
            - bitrise-build-cache-cli-v1-
