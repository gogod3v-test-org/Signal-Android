      # Restore Gradle wrapper cache
      - restore_cache:
          name: Restore Gradle wrapper cache
          keys:
            - gradle-wrapper-{{ checksum "gradle/wrapper/gradle-wrapper.properties" }}
            - gradle-wrapper-
      # Restore Gradle dependencies cache
      - restore_cache:
          name: Restore Gradle dependencies cache
          keys:
            - gradle-deps-{{ checksum "build.gradle" }}-{{ checksum "app/build.gradle" }}
            - gradle-deps-
      - run:
          name: Disable Gradle Dependency Verification
          command: |
            rm ./gradle/verification-metadata.xml
      - run:
          name: Lint PlayProdDebug
