          key: gradle-deps-{{ checksum "build.gradle" }}-{{ checksum "app/build.gradle" }}
      # Save Bitrise Build Cache CLI
      - save_cache:
          name: Save Bitrise Build Cache CLI
          paths:
            - /tmp/bin/bitrise-build-cache
          key: bitrise-build-cache-cli-v1-{{ arch }}
      # - run:
      #     name: Assemble playProdDebug
      #     command: ./gradlew :Signal-Android:assemblePlayProdDebug

  run-tests-without-build-cache:
    # Specify the execution environment. You can specify an image from Docker Hub or use one of our convenience images from CircleCI's Developer Hub.
    # See: https://circleci.com/docs/configuration-reference/#executor-job
    executor:
